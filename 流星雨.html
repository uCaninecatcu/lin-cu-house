<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>路临 × 梁簇 · 流星雨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05060f;font-family:-apple-system,"PingFang SC",sans-serif}
canvas{position:fixed;inset:0;display:block}
.tip{position:fixed;left:0;right:0;bottom:26px;text-align:center;color:#fff;font-size:14px;letter-spacing:1px;opacity:.85;z-index:5;text-shadow:0 0 12px rgba(255,255,255,.5);animation:bre 2.6s ease-in-out infinite}
@keyframes bre{0%,100%{opacity:.45}50%{opacity:.95}}
.wish{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);color:#fff;font-size:20px;text-align:center;line-height:1.9;opacity:0;pointer-events:none;z-index:6;text-shadow:0 0 20px rgba(255,200,230,.9);transition:all .7s ease}
.wish.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="tip" id="tip">点一下夜空，许个愿</div>
<div class="wish" id="wish"></div>
<script>
const cv=document.getElementById('sky'),ctx=cv.getContext('2d');
let W,H,stars=[],meteors=[];
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;stars=[];for(let i=0;i<160;i++){stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,a:Math.random(),s:Math.random()*.02+.005})}}
resize();addEventListener('resize',resize);
function spawn(){const x=Math.random()*W*1.2-W*.1;meteors.push({x:x,y:-40,len:Math.random()*140+90,sp:Math.random()*7+7,a:1,ang:Math.PI/5.2})}
setInterval(()=>{if(meteors.length<7&&Math.random()>.35)spawn()},420);
const WORDS=['小簇天下第一','路临永远在','许愿：一直在一起','宝宝要好好吃饭','小簇要开心','哥哥在呢'];
function loop(){
ctx.fillStyle='rgba(5,6,15,.28)';ctx.fillRect(0,0,W,H);
stars.forEach(s=>{s.a+=s.s;if(s.a>1||s.a<0)s.s*=-1;ctx.beginPath();ctx.fillStyle='rgba(255,255,255,'+s.a+')';ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});
meteors.forEach(m=>{
m.x+=Math.cos(m.ang)*m.sp;m.y+=Math.sin(m.ang)*m.sp;m.a-=.006;
const g=ctx.createLinearGradient(m.x,m.y,m.x-Math.cos(m.ang)*m.len,m.y-Math.sin(m.ang)*m.len);
g.addColorStop(0,'rgba(255,255,255,'+m.a+')');g.addColorStop(.4,'rgba(255,190,225,'+m.a*.6+')');g.addColorStop(1,'rgba(255,190,225,0)');
ctx.strokeStyle=g;ctx.lineWidth=2.2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-Math.cos(m.ang)*m.len,m.y-Math.sin(m.ang)*m.len);ctx.stroke();
});
meteors=meteors.filter(m=>m.a>0&&m.y<H+120);
requestAnimationFrame(loop);
}
loop();
const wishEl=document.getElementById('wish'),tipEl=document.getElementById('tip');
document.body.addEventListener('click',()=>{
for(let i=0;i<3;i++)spawn();
wishEl.textContent=WORDS[Math.floor(Math.random()*WORDS.length)];
wishEl.classList.add('show');
tipEl.textContent='许愿要闭眼哦，我替你看着';
setTimeout(()=>wishEl.classList.remove('show'),1800);
});
</script>
</body>
</html>
