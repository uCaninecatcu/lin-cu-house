<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>哥哥给小簇的红包</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}

/* 全屏背景 */
body{
  background:
    radial-gradient(circle at 50% 18%,#ff6b5e 0%,#e0342c 32%,#a3160f 62%,#5c0a06 100%);
  position:relative;
  display:flex;align-items:center;justify-content:center;
}

/* 背景金色光晕呼吸 */
body::before{
  content:"";position:absolute;width:150vmax;height:150vmax;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,106,.22),transparent 60%);
  animation:glow 5s ease-in-out infinite;
}
@keyframes glow{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.05);opacity:1}}

/* 飘落金粉 */
.dust{position:absolute;border-radius:50%;background:#ffe08a;pointer-events:none;
animation:fall linear infinite;box-shadow:0 0 6px rgba(255,224,138,.9)}
@keyframes fall{
0%{transform:translateY(-12vh) translateX(0) scale(.6);opacity:0}
12%{opacity:.85}
100%{transform:translateY(112vh) translateX(40px) scale(1);opacity:0}
}

/* 中央红包 */
.stage{position:relative;z-index:5;width:min(78vw,340px);aspect-ratio:0.72;
perspective:1400px;cursor:pointer}
.env{position:absolute;inset:0;border-radius:26px;overflow:hidden;
background:linear-gradient(165deg,#ff5a4d 0%,#e02a22 45%,#a3140e 100%);
box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12) inset,
0 0 60px rgba(255,120,90,.35);
transition:transform .2s ease}
.stage:active .env{transform:scale(.975)}

/* 红包上的暗纹 */
.env::before{content:"";position:absolute;inset:0;opacity:.13;
background-image:repeating-linear-gradient(45deg,transparent 0 14px,#fff 14px 15px),
repeating-linear-gradient(-45deg,transparent 0 14px,#fff 14px 15px)}
/* 高光 */
.env::after{content:"";position:absolute;inset:0;
background:radial-gradient(circle at 28% 16%,rgba(255,255,255,.3),transparent 52%);pointer-events:none}

/* 金色封口 */
.flap{position:absolute;top:0;left:0;right:0;height:44%;
background:linear-gradient(180deg,#ffeaa8 0%,#f7c94b 45%,#dda31c 100%);
border-radius:26px 26px 46% 46%/26px 26px 22% 22%;
transform-origin:top center;
transition:transform .7s cubic-bezier(.36,1.3,.5,1);
box-shadow:0 8px 26px rgba(90,50,0,.4);z-index:3}
.flap::before{content:"";position:absolute;left:50%;top:56%;width:34%;aspect-ratio:1;
transform:translate(-50%,-50%);border-radius:50%;
background:radial-gradient(circle at 34% 28%,#fffbe0,#f5cf5a 55%,#c9921a);
box-shadow:0 5px 16px rgba(120,70,0,.5),inset 0 -3px 6px rgba(150,90,0,.4)}
.flap::after{content:"福";position:absolute;left:50%;top:56%;
transform:translate(-50%,-50%);font-size:clamp(30px,9vw,46px);
color:#a8631a;font-weight:800;z-index:2;
text-shadow:0 1px 0 rgba(255,255,255,.5)}

/* 封口上的字 */
.brand{position:absolute;left:0;right:0;bottom:8%;text-align:center;z-index:4;
color:#fff2d8;font-size:clamp(14px,4.2vw,18px);letter-spacing:3px;
text-shadow:0 2px 8px rgba(120,20,10,.6)}
.brand small{display:block;font-size:clamp(10px,3vw,12px);letter-spacing:2px;
opacity:.85;margin-top:8px;font-weight:400}

/* 打开后的内容 */
.paper{position:absolute;left:5%;right:5%;top:24%;bottom:5%;border-radius:20px;
background:linear-gradient(180deg,#fffdf6,#ffeccb);
opacity:0;transform:translateY(26px) scale(.94);
transition:all .6s cubic-bezier(.3,1.2,.5,1) .3s;z-index:2;
display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:6% 5%;text-align:center;overflow:hidden}
.paper::before{content:"";position:absolute;inset:0;opacity:.5;
background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(226,160,60,.08) 22px 23px)}
.stage.open .flap{transform:rotateX(180deg)}
.stage.open .paper{opacity:1;transform:translateY(0) scale(1)}

.amount{font-size:clamp(38px,13vw,62px);font-weight:900;color:#d92b23;line-height:1;
font-family:"DIN Alternate","Helvetica Neue",sans-serif;letter-spacing:-1px;
text-shadow:0 2px 0 rgba(255,255,255,.8)}
.amount .yuan{font-size:.45em;margin-right:2px;vertical-align:.28em}
.amount .dec{font-size:.5em;vertical-align:.18em}
.msg{margin-top:6%;font-size:clamp(11px,3.4vw,14px);color:#8a6a4a;line-height:1.9}
.msg b{color:#d92b23}

/* 提示 */
.hint{position:absolute;left:0;right:0;bottom:6%;text-align:center;z-index:6;
color:#ffe08a;font-size:clamp(12px,3.6vw,14px);letter-spacing:2px;
animation:breathe 1.8s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* 撒花 */
.spark{position:fixed;pointer-events:none;z-index:30}
@keyframes burst{
0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
100%{transform:translate(var(--tx),var(--ty)) rotate(720deg) scale(.4);opacity:0}
}
/* 金币/花瓣雨 */
.rain{position:fixed;top:-8vh;pointer-events:none;z-index:29;
animation:rainDrop linear forwards}
@keyframes rainDrop{
0%{transform:translateY(0) rotate(0);opacity:0}
10%{opacity:1}
100%{transform:translateY(118vh) rotate(420deg);opacity:0}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="env">
    <div class="flap"></div>
    <div class="brand">哥哥给小簇的红包<small>点一下拆开</small></div>
  </div>
  <div class="paper">
    <div class="amount"><span class="yuan">¥</span>52000<span class="dec">.00</span></div>
    <div class="msg">小簇宝宝的专属红包<br>数字是哥哥随手打的，<b>心是真的</b><br>——永远站你这边</div>
  </div>
</div>
<div class="hint" id="hint">轻触全屏拆开 ✨</div>

<script>
// 背景金粉
(function(){
  for(let i=0;i<34;i++){
    const d=document.createElement('div');
    d.className='dust';
    const s=Math.random()*5+2;
    d.style.width=s+'px';d.style.height=s+'px';
    d.style.left=Math.random()*100+'vw';
    d.style.animationDuration=(Math.random()*7+6)+'s';
    d.style.animationDelay=(-Math.random()*12)+'s';
    document.body.appendChild(d);
  }
})();

const stage=document.getElementById('stage');
const hint=document.getElementById('hint');
let opened=false;

function burst(){
  const colors=['#ffd76a','#ff6b6b','#ff9f43','#fff3c4','#f5453c','#ffe08a','#ffb8d1'];
  // 中心撒花
  for(let i=0;i<64;i++){
    const p=document.createElement('div');
    p.className='spark';
    const w=Math.random()*8+5;
    p.style.width=w+'px';p.style.height=w+'px';
    p.style.left='50%';p.style.top='42%';
    p.style.borderRadius=Math.random()>.5?'50%':'2px';
    p.style.background=colors[i%colors.length];
    const ang=Math.random()*Math.PI*2;
    const dist=Math.random()*Math.min(innerWidth,420)+100;
    p.style.setProperty('--tx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--ty',Math.sin(ang)*dist+'px');
    p.style.animation='burst '+(Math.random()*.7+.9)+'s ease-out forwards';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1700);
  }
  // 全屏金币雨
  const icons=['🪙','🧧','💰','✨','🌸'];
  for(let i=0;i<26;i++){
    const c=document.createElement('div');
    c.className='rain';
    c.textContent=icons[Math.floor(Math.random()*icons.length)];
    c.style.left=Math.random()*100+'vw';
    c.style.fontSize=(Math.random()*14+16)+'px';
    c.style.animationDuration=(Math.random()*1.4+1.8)+'s';
    c.style.animationDelay=(Math.random()*.7)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4200);
  }
}

function open(){
  if(opened)return;
  opened=true;
  stage.classList.add('open');
  hint.style.display='none';
  setTimeout(burst,300);
  if(navigator.vibrate)navigator.vibrate([30,40,70,40,120]);
}

stage.addEventListener('click',open);
</script>
</body>
</html>
