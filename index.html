<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif}
body{
  min-height:100vh;
  background-color:#ffe9f0;
  background-image:radial-gradient(#ffc9dd 1.6px, transparent 1.6px);
  background-size:18px 18px;
  padding:26px 16px 40px;
}
h1{font-size:20px;color:#e8608f;font-weight:800;text-align:center;letter-spacing:.5px}
.sub{font-size:12.5px;color:#c58aa4;text-align:center;margin-top:8px;line-height:1.7}
.cards{margin-top:24px;display:flex;flex-direction:column;gap:14px}
.card{
  background:#fff;
  border-radius:20px;
  padding:18px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  box-shadow:0 8px 22px rgba(232,96,143,.16);
  border:1.5px solid #ffe0ec;
  text-decoration:none;
  transition:transform .15s ease, box-shadow .15s ease;
}
.card:active{transform:scale(.97);box-shadow:0 4px 12px rgba(232,96,143,.2)}
.ico{
  flex:0 0 auto;width:52px;height:52px;border-radius:16px;
  background:linear-gradient(135deg,#ffd6e4,#ffb8d1);
  display:flex;align-items:center;justify-content:center;font-size:26px;
}
.txt{flex:1 1 auto;min-width:0}
.name{font-size:15.5px;color:#e8608f;font-weight:800}
.desc{font-size:12px;color:#b58aa0;margin-top:5px;line-height:1.6}
.dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#ffc9dd}
.foot{margin-top:26px;text-align:center;font-size:11.5px;color:#d9a8bd;line-height:1.9}
