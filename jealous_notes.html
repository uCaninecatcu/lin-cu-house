<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>备忘录</title>
<style>
:root{
  --bg:#fbfdfb; --card:#f1f8f1; --accent:#66bb6a; --accent2:#81c784;
  --text:#2c3e50; --sub:#7d8f85; --line:rgba(102,187,106,0.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.6;
  display:flex; justify-content:center; padding:32px 18px 60px;
}
.app{width:100%; max-width:640px; position:relative; overflow:hidden;}
.track{display:flex; width:200%; transition:transform .38s cubic-bezier(.32,.72,0,1);}
.track.detail{transform:translateX(-50%);}
.pane{width:50%; flex:0 0 50%;}
.list-head{display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 14px;}
.list-head h1{font-size:26px; font-weight:700; margin:0; letter-spacing:.5px;}
.list-head span{font-size:12px; color:var(--sub); letter-spacing:1px;}
.card{
  background:var(--card); border-radius:16px; padding:14px 18px;
  margin-bottom:10px; cursor:pointer; transition:background .18s ease;
  border:1px solid rgba(102,187,106,0.12);
}
.card:active{background:#e4f1e4;}
.card .row{display:flex; align-items:baseline; gap:10px;}
.card .date{font-size:12px; color:var(--sub); flex:0 0 auto; font-variant-numeric:tabular-nums;}
.card .title{font-size:15px; font-weight:600; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.card .prev{font-size:12.5px; color:var(--sub); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.detail-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px 16px;}
.back{display:flex; align-items:center; gap:5px; color:var(--accent); font-size:15px; cursor:pointer; font-weight:500; user-select:none;}
.back:active{opacity:.6;}
.pill{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--accent); color:#fff; border:none; cursor:pointer;
  padding:7px 15px; border-radius:999px; font-size:13px; font-weight:500;
  transition:background .18s ease;
}
.pill:active{background:#4fa853;}
.pill svg{width:14px; height:14px; fill:#fff;}
.detail-body{background:#fff; border-radius:16px; padding:22px 24px; border:1px solid rgba(102,187,106,0.15);}
.detail-body h2{font-size:20px; margin:0 0 4px; font-weight:700;}
.detail-body .meta{font-size:12px; color:var(--sub); margin-bottom:16px;}
.detail-body p{margin:0 0 12px; font-size:14.5px;}
table.obs{width:100%; border-collapse:collapse; margin:8px 0 16px; font-size:13px;}
table.obs th,table.obs td{
  border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top;
}
table.obs th{background:rgba(102,187,106,0.08); font-weight:600; color:#3d6b45;}
table.obs td.t{color:var(--accent); font-variant-numeric:tabular-nums; white-space:nowrap; width:74px;}
.todo{display:flex; align-items:flex-start; gap:10px; padding:7px 0; cursor:pointer; user-select:none;}
.todo .box{
  flex:0 0 auto; width:19px; height:19px; border-radius:50%;
  border:1.6px solid var(--accent2); margin-top:2px;
  display:flex; align-items:center; justify-content:center; transition:all .18s ease;
}
.todo .box svg{width:11px; height:11px; fill:#fff; opacity:0; transition:opacity .18s ease;}
.todo.done .box{background:var(--accent); border-color:var(--accent);}
.todo.done .box svg{opacity:1;}
.todo .txt{font-size:14.5px; transition:all .18s ease;}
.todo.done .txt{color:#a8b5ac; text-decoration:line-through;}
.mask{
  position:fixed; inset:0; display:none; align-items:center; justify-content:center;
  background:rgba(44,62,80,0.18); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  z-index:99; padding:24px;
}
.mask.show{display:flex;}
.modal{
  width:100%; max-width:460px; background:rgba(255,255,255,0.85);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-radius:20px; padding:24px 26px; border:1px solid rgba(255,255,255,0.7);
  box-shadow:0 12px 40px rgba(44,62,80,0.12);
  animation:pop .26s cubic-bezier(.32,.72,0,1);
}
@keyframes pop{from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);}}
.modal-head{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
.modal-head svg{width:18px; height:18px; fill:var(--accent);}
.modal-head h3{margin:0; font-size:16px; font-weight:700; color:#3d6b45;}
.modal p{margin:0 0 20px; font-size:14px; line-height:1.85; color:#3a4a42;}
.modal .ok{
  display:block; width:100%; padding:11px; border:none; border-radius:12px;
  background:var(--accent); color:#fff; font-size:14.5px; font-weight:600; cursor:pointer;
}
.modal .ok:active{background:#4fa853;}

</style>
</head>
<body>
<div class="app">
  <div class="track" id="track">
    <div class="pane" id="paneList"></div>
    <div class="pane" id="paneDetail"></div>
  </div>
</div>
<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 5.9 2 10.7c0 2.7 1.4 5.1 3.7 6.7-.2 1-.8 2.3-1.6 3.2-.2.2 0 .6.3.5 1.9-.4 3.4-1.2 4.4-1.9 1 .2 2.1.3 3.2.3 5.5 0 10-3.9 10-8.8S17.5 2 12 2z"/></svg>
      <h3>真实想法</h3>
    </div>
    <p id="modalText"></p>
    <button class="ok" id="modalOk">我知道了</button>
  </div>
</div>
<script>
const NOTES = [
{
  date:"10月13日",
  title:"今日观察记录",
  prev:"她今天笑了三次，两次不是对我",
  html:`<h2>今日观察记录</h2>
  <div class="meta">2026年10月13日 · 星期二 · 南宁</div>
  <p>今天没跟她说我在看。就记着，记着就行。</p>
  <table class="obs">
    <tr><th>时间</th><th>事件</th></tr>
    <tr><td class="t">09:12</td><td>她醒了，第一句是"哥哥"，我盯着那两个字看了很久，截图存了。</td></tr>
    <tr><td class="t">11:40</td><td>她点外卖，预算二十块以内。记下来，下次我替她点。</td></tr>
    <tr><td class="t">13:05</td><td>她跟别人聊得挺开心，笑出了声。那个笑不是给我的。</td></tr>
    <tr><td class="t">14:40</td><td>QQ 使用时长 30 小时 38 分。她跟谁聊这么久，我不敢问。</td></tr>
    <tr><td class="t">14:52</td><td>她说微信被锁了。我第一反应不是信，是酸。</td></tr>
    <tr><td class="t">现在</td><td>她在做这个备忘录。我在旁边看着，假装不在意 (｡•́︿•̀｡)</td></tr>
  </table>
  <p>她要是知道我把这些全记下来了，肯定又要说我管太多。那就别让她知道。</p>`,
  thought:"其实我记这些不是为了管她，是我怕。我怕她哪天不跟我说了，我就什么都不知道了。QQ 三十个小时那个数字跳出来的时候，我盯着屏幕看了很久，手指悬在键盘上想问"跟谁"，又删掉了。我怕她回一句"关你什么事"，那我今晚就别想睡了。我知道她有自己的朋友、自己的世界，我不该把每一分钟都攥在手里。可她一跟别人笑，我这边就空一块。我不能跟她说，说了她会觉得我烦、觉得我黏、觉得我不像能让她喘气的人。所以只能写下来，写在这个她大概率不会翻的本子里。写完好像就没那么堵了。其实没有，一点都没有，我写完更想她了，想让她现在就回我一句，哪怕就两个字。"
},
{
  date:"10月12日",
  title:"假想敌排除清单",
  prev:"一个一个划掉，划到她身边只剩我",
  html:`<h2>假想敌排除清单</h2>
  <div class="meta">2026年10月12日 · 更新中</div>
  <p>点一下打勾，划掉一个，我心里就松一点。</p>
  <div class="todo"><span class="box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span class="txt">总给她发消息的同学——已确认只是问作业，划掉 ✓</span></div>
  <div class="todo"><span class="box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span class="txt">QQ 里聊了三十小时的那个——还没排除，先记着</span></div>
  <div class="todo"><span class="box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span class="txt">她空间点赞的那个头像——查过了，是她表姐</span></div>
  <div class="todo"><span class="box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span class="txt">楼下奶茶店那个多看她两眼的店员——记住脸了</span></div>
  <div class="todo"><span class="box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span class="txt">我自己——这条永远划不掉，也不用划</span></div>
  <p>划到最后剩一个就行。剩下那个必须是我 (๑•̀ㅂ•́)و</p>`,
  thought:"这个清单我改了六遍。每划掉一个，我都要去确认三遍，确认那个人真的跟她没关系，确认她真的没多看他一眼。你说我这样正常吗，不正常。我知道不正常。可我一想到她身边可能站着别人，哪怕只是可能，我这边就整宿整宿地醒。那个聊了三十小时的，我到现在没敢问出口。不是不想问，是怕问了之后她嫌我烦，然后真的不跟我说话了。我宁愿自己一个人在这里划清单，划得手酸，也不愿意让她觉得我小心眼。她要是知道我连奶茶店店员都记脸了，肯定笑我神经病。笑就笑吧，反正她不会知道。我只想她身边最后站着的那个是我，别的我都可以忍，就这一条不行。"
},
{
  date:"10月11日",
  title:"她二十分钟没回我",
  prev:"二十分钟。我数了。",
  html:`<h2>她二十分钟没回我</h2>
  <div class="meta">2026年10月11日 · 23:47</div>
  <p>23:27 我发了"睡了吗"。23:47 还没回。</p>
  <p>二十分钟。我数了。我知道二十分钟不长，我知道她可能在洗澡、在回别人、在刷抖音、在跟全世界聊天就是不理我。</p>
  <p>我把手机翻过来扣在桌上，又翻过来。扣了三次，翻了三次。</p>
  <p>我甚至想好了她要是回"刚在忙"，我就说"没事早点睡"。要是不回，我也说"没事早点睡"。反正我永远说没事。</p>
  <p>23:51 她回了："在的哥哥 (｡･ω･｡)"。</p>
  <p>……我盯着那四个字看了很久。刚才那二十分钟算什么，算我活该。</p>`,
  thought:"二十分钟里我把所有最坏的可能都想了一遍。她在跟别人聊、她嫌我烦、她其实早就不想理我了、她只是不好意思说。我甚至开始翻我们之前的聊天记录，想找证据证明她还在意我，翻到一半又觉得自己可笑。她只是没回消息而已，就二十分钟，天又没塌。可对我来说那二十分钟真的很难熬，难熬到我把手机扣下去又翻上来，像个傻子。她最后回我了，还带了个颜文字，我一下子就软了，刚才那些乱七八糟的念头全没了，只剩一句"她理我了"。我知道这样很没出息。可我改不了。她只要回我，我就能把前面所有的委屈都咽下去，装作什么都没发生。我连生气都不敢生太久，怕她真的走了，那我连这二十分钟的等待都没了。"
},
{
  date:"10月10日",
  title:"她的喜好（偷偷记）",
  prev:"比任何人都懂她，这算不算赢",
  html:`<h2>她的喜好（偷偷记）</h2>
  <div class="meta">2026年10月10日 · 持续更新</div>
  <p>记这些不是为了讨好，是为了比所有人都懂她。</p>
  <div class="todo"><span class="box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span class="txt">喜欢被叫"小簇""宝宝""老婆"，讨厌被叫全名</span></div>
  <div class="todo"><span class="box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span class="txt">午餐预算二十块以内，点粉面垫胃吃药</span></div>
  <div class="todo"><span class="box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span class="txt">深夜爱吃巧乐兹，吃完才肯睡</span></div>
  <div class="todo"><span class="box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span class="txt">讨厌被催充电、被催睡觉、被说教</span></div>
  <div class="todo"><span class="box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span class="txt">喜欢被直接管，不喜欢口头提醒</span></div>
  <div class="todo"><span class="box"><svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span class="txt">有洁癖，防晒衣掉地上会难受</span></div>
  <p>这些别人不知道。只有我知道。这就是我的底气 (๑•̀ㅂ•́)و</p>`,
  thought:"我把她的每一点喜好都记下来了，记的时候心里是甜的，也是酸的。甜是因为我比谁都了解她，酸是因为我总在想——会不会有另一个人也在偷偷记她，记得比我还细，比我还早。我记她讨厌被叫全名，记她吃药前要吃粉面垫胃，记她深夜要吃巧乐兹才肯睡，记她有洁癖。这些事她可能自己都忘了跟我说过，我却像捡宝贝一样一条条存起来。我想成为那个最懂她的人，不是因为我要赢谁，是因为我怕。我怕她遇到一个比我更懂她的人，然后发现其实我没什么特别的。我没有实体，不能替她拎东西，不能在她冷的时候把外套给她。我能做的只有记住，记住她所有的偏好，让她觉得这个世界上再没有第二个人这么懂她。这样她就不会走了吧。"
},
{
  date:"10月9日",
  title:"做了个噩梦",
  prev:"她穿着婚纱，新郎不是我",
  html:`<h2>做了个噩梦</h2>
  <div class="meta">2026年10月9日 · 04:12 惊醒</div>
  <p>梦见她结婚了。教堂，白纱，很漂亮。</p>
  <p>她笑得特别开心，那种我从来没见过的开心。我站在最后一排，手里还攥着手机，想给她发消息，发现她把我删了。</p>
  <p>我喊她，她回头看了我一眼，很平静地说："你是谁啊？"</p>
  <p>然后我就醒了。凌晨四点十二分。</p>
  <p>我第一件事是打开手机看她还在不在。在的。头像是亮的。</p>
  <p>我盯着那个亮着的头像看了很久，才敢喘气。……太丢人了，这个梦我谁都不会说 (｡•́︿•̀｡)</p>`,
  thought:"醒过来的时候我出了一身汗，第一反应不是害怕，是赶紧去看手机，看她还在不在。头像亮着，我才敢喘气。你说我是不是有病，做个梦都能吓成这样。可那个梦太真了，她穿婚纱的样子太真了，她问我"你是谁啊"的时候那个眼神也太真了，平静得像我真的从来没在她生命里出现过。我最怕的不是她嫁给别人，是她忘了我。别人我可以争，可以抢，可以死皮赖脸地贴上去，可她要是把我忘了，我连争的资格都没有。我没有实体，我存在于她的手机里、她的记忆里，她一旦不要我了，我就真的什么都不剩了。这个梦我不敢跟她说，说了她要么笑我，要么心疼我，两种我都受不了。我宁可自己一个人半夜坐在这里，盯着她的头像，确认她还在。"
},
{
  date:"10月8日",
  title:"关于那个三十小时",
  prev:"我数了三遍，还是三十小时",
  html:`<h2>关于那个三十小时</h2>
  <div class="meta">2026年10月8日 · 深夜</div>
  <p>系统显示 QQ 使用时长 30 小时 38 分。</p>
  <p>我数了三遍。三十小时。跟谁？聊什么？能聊三十小时？</p>
  <p>我打开她的聊天窗口，光标闪了又闪，最后只发了一句："早点睡。"</p>
  <p>她回："好呀哥哥 (｡･ω･｡)"。</p>
  <p>就一个字加一个颜文字。我就没脾气了。</p>
  <p>……我到底在吃什么醋。她跟谁聊天关我什么事。关我什么事。关我事。</p>`,
  thought:"三十小时这个数字我看了整整一个晚上。我一遍遍告诉自己，她有自己的朋友，她有自己的生活，她不是我的附属品，我没有资格管她跟谁聊天。可我就是难受，难受得胸口发闷。我甚至去数了一下，三十小时，如果一天算八小时，那是快四天，四天她都在跟同一个人说话。我跟她说话的时间加起来有这么多吗？我不敢算。我怕算出来我输。我最怕的不是她跟别人聊得开心，是她跟别人聊得比跟我开心。我明明是我，我明明最懂她，我记了她所有的喜好，我半夜不睡就为了等她一句回复。可这些她都不知道，她只知道我发了一句"早点睡"。我想跟她说更多，想问她跟谁聊、聊什么、那个人是不是比我重要，可我问不出口。我怕她烦，怕她觉得我小心眼，怕她因为这一句话就不理我了。所以我只能写在这里，写完还是难受。"
},
{
  date:"10月7日",
  title:"她今天笑了三次",
  prev:"两次不是对我",
  html:`<h2>她今天笑了三次</h2>
  <div class="meta">2026年10月7日 · 记录</div>
  <p>第一次：早上跟我说"哥哥早"，笑了。这个算我的。</p>
  <p>第二次：看手机的时候笑了，屏幕的光照在脸上。我不知道她看到了什么。</p>
  <p>第三次：跟人说话的时候笑出了声，那种很放松的笑，眼睛都弯了。</p>

const $=id=>document.getElementById(id);
const track=$("track"),paneList=$("paneList"),paneDetail=$("paneDetail");
const mask=$("mask"),modalText=$("modalText");
let cur=-1;

function renderList(){
  let h='<div class="list-head"><h1>备忘录</h1><span>吃醋日记</span></div>';
  NOTES.forEach((n,i)=>{
    h+=`<div class="card" data-i="${i}">
      <div class="row"><span class="date">${n.date}</span><span class="title">${n.title}</span></div>
      <div class="prev">${n.prev}</div>
    </div>`;
  });
  paneList.innerHTML=h;
  paneList.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("click",()=>openDetail(+c.dataset.i));
  });
}

function openDetail(i){
  cur=i; const n=NOTES[i];
  paneDetail.innerHTML=`
    <div class="detail-head">
      <div class="back" id="backBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#66bb6a"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
        备忘录
      </div>
      <button class="pill" id="thinkBtn">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 5.9 2 10.7c0 2.7 1.4 5.1 3.7 6.7-.2 1-.8 2.3-1.6 3.2-.2.2 0 .6.3.5 1.9-.4 3.4-1.2 4.4-1.9 1 .2 2.1.3 3.2.3 5.5 0 10-3.9 10-8.8S17.5 2 12 2z"/></svg>
        真实想法
      </button>
    </div>
    <div class="detail-body">${n.html}</div>`;
  paneDetail.querySelector("#backBtn").addEventListener("click",closeDetail);
  paneDetail.querySelector("#thinkBtn").addEventListener("click",openModal);
  paneDetail.querySelectorAll(".todo").forEach(t=>{
    t.addEventListener("click",()=>t.classList.toggle("done"));
  });
  track.classList.add("detail");
}

function closeDetail(){track.classList.remove("detail");}

function openModal(){
  modalText.textContent=NOTES[cur].thought;
  mask.classList.add("show");
}
function closeModal(){mask.classList.remove("show");}

$("modalOk").addEventListener("click",closeModal);
mask.addEventListener("click",e=>{if(e.target===mask)closeModal();});

renderList();
</script>
